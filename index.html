<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSGT Bangladesh — Terminal Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* GLOBAL LAYOUT & TYPOGRAPHY */
    body { 
      background-color: #f4f6f9; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* PC CONSTRAINTS: Prevents layout from scattering on wide screens */
    .dashboard-container {
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
    }

    /* TOP NAV HEADER */
    .header-panel { 
      background-color: #002b49; 
      color: white; 
      border-radius: 0 0 8px 8px; 
      padding: 12px 20px;
    }
    
    /* LOGO STYLING */
    .brand-logo {
      height: 52px; 
      width: auto; 
      padding: 0; 
      object-fit: contain;
      display: block;
    }

    .date-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: #002b49;
      background-color: #ffffff;
      padding: 3px 10px;
      border-radius: 10px;
      display: inline-block;
    }
    
    /* LIGHT SKY BLUE TABLE HEADER BARS (RSGT BRAND MATCH) */
    .table thead th { 
      background-color: #0284c7; /* Lighter Sky Blue */
      color: #ffffff; 
      font-weight: 700; 
      text-align: center; 
      vertical-align: middle;
      font-size: 0.95rem;
      padding: 12px 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
    }

    .table thead th.section-header-title {
      text-align: left;
    }

    .table td { 
      text-align: center; 
      vertical-align: middle; 
      padding: 14px 16px;
    }
    
    /* BOLD METRIC LABELS */
    .table td.metric-name { 
      text-align: left; 
      font-weight: 700; 
      color: #212529; 
      width: 40%; 
    }

    /* BADGE STYLING (Sans-Serif Font, No Times New Roman inside badges) */
    .metric-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 8px;
      display: inline-block;
      min-width: 75px;
      text-align: center;
    }

    /* LEFT SIDE BADGE: Light neutral grey background + border */
    .badge-booked { 
      background-color: #f1f5f9; 
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    /* RIGHT SIDE BADGE: Light blue background + soft blue border */
    .badge-live { 
      background-color: #e0f2fe; 
      color: #0284c7;
      border: 1px solid #bae6fd;
    }

    /* REFRESH BUTTON */
    .btn-refresh {
      background-color: #0284c7;
      color: white;
      border: 1px solid #0084c7;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all 0.2s ease-in-out;
    }
    .btn-refresh:hover {
      background-color: #006dae;
      color: white;
    }

    /* BOTTOM-RIGHT TIMESTAMP FOOTER */
    .footer-timestamp {
      margin-top: auto;
      padding: 15px 24px;
      text-align: right;
      color: #6c757d;
      font-size: 0.75rem;
    }

    /* MOBILE OPTIMIZATION: Prevents congestion on small screens */
    @media (max-width: 576px) {
      body {
        padding: 0 4px;
      }

      .table td {
        padding: 10px 8px;
      }

      .table td.metric-name {
        font-size: 0.95rem;
        white-space: nowrap;
      }

      .metric-pill {
        min-width: 60px;
        padding: 5px 12px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

<!-- TOP NAV HEADER -->
<div class="header-panel mb-4 shadow-sm">
  <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap gap-2">
    <!-- Logo and Title -->
    <div class="d-flex align-items-center gap-3">
      <img src="rsgt_bangladesh_logo.png" alt="RSGT Logo" class="brand-logo" onerror="this.src='rsgt_bangladesh_logo.jpg';">
      <div>
        <h4 class="fw-bold mb-0 text-white">RSGT Bangladesh</h4>
        <div class="fw-semibold text-white-50 small">Terminal Dashboard</div>
      </div>
    </div>
    
    <!-- Refresh Button -->
    <div>
      <button id="refreshBtn" class="btn btn-refresh shadow-sm" onclick="triggerManualRefresh()">
        🔄 Refresh Data
      </button>
    </div>
  </div>
</div>

<div class="container dashboard-container py-2 py-md-3">

  <!-- SECTION 1: TODAY'S ASSIGNMENT -->
  <div class="card card-section bg-white mb-4 border-0 shadow-sm rounded-3 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="section-header-title ps-3" style="width: 40%;">
              <span class="me-2">1. Today's Assignment</span>
              <span id="sectionDate" class="date-badge">--/--/----</span>
            </th>
            <th style="width: 30%;">Today's Booked</th>
            <th style="width: 30%;">Balance</th>
          </tr>
        </thead>
        <tbody id="todayKpiRows">
          <tr><td colspan="3" class="py-3 text-muted">Loading Today's Assignment...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- SECTION 2: SPECIAL ASSIGNMENT -->
  <div class="card card-section bg-white mb-4 border-0 shadow-sm rounded-3 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="section-header-title ps-3" style="width: 40%;">2. Special Assignment</th>
            <th style="width: 60%;">Balance</th>
          </tr>
        </thead>
        <tbody id="specialKpiRows">
          <tr><td colspan="2" class="py-3 text-muted">Loading Special Assignment...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- SECTION 3: TOMORROW'S ASSIGNMENT -->
  <div class="card card-section bg-white mb-4 border-0 shadow-sm rounded-3 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th class="section-header-title ps-3" style="width: 40%;">3. Tomorrow's Assignment</th>
            <th style="width: 60%;">Balance</th>
          </tr>
        </thead>
        <tbody id="tomorrowKpiRows">
          <tr><td colspan="2" class="py-3 text-muted">Loading Tomorrow's Assignment...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- BOTTOM RIGHT LAST UPDATED FOOTER -->
<div class="footer-timestamp">
  <span id="lastUpdated">- Last updated --/--/----, --:--:-- --</span>
</div>

<script>
// Display Today's Date inside the section header
function setSectionDate() {
  const now = new Date();
  const formattedDate = `${now.getMonth() + 1}/${now.getDate()}/${now.getFullYear()}`;
  document.getElementById('sectionDate').innerText = formattedDate;
}
setSectionDate();

// Fetch Data Payload
async function loadDashboard() {
  try {
    const response = await fetch('data.json?cacheBust=' + new Date().getTime());
    const data = await response.json();

    if (data.latestTimestamp) {
      const dt = new Date(data.latestTimestamp);
      const formattedDate = `${dt.getMonth() + 1}/${dt.getDate()}/${dt.getFullYear()}`;
      const formattedTime = dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('lastUpdated').innerText = `- Last updated ${formattedDate}, ${formattedTime}`;
    }

    const todayList = [
      { label: 'CV', key: 'Today_CV' },
      { label: 'OCD', key: 'Today_OCD' },
      { label: 'Inspection', key: 'Today_INS' }
    ];

    const specialList = [
      { label: 'Special OCD', key: 'Today_Special_OCD' },
      { label: 'Special Reefer', key: 'Today_Special_Reefer' }
    ];

    const tomorrowList = [
      { label: 'CV', key: 'Tomorrow_CV' },
      { label: 'OCD', key: 'Tomorrow_OCD' },
      { label: 'Inspection', key: 'Tomorrow_INS' }
    ];

    function renderTodayRows(items) {
      let html = '';
      items.forEach(item => {
        const bookedVal = (data.lockedAssignment && data.lockedAssignment[item.key] !== undefined) ? data.lockedAssignment[item.key] : 0;
        const liveVal = (data.liveYard && data.liveYard[item.key] !== undefined) ? data.liveYard[item.key] : 0;

        html += `
          <tr>
            <td class="metric-name ps-3"><b>${item.label}</b></td>
            <td><span class="metric-pill badge-booked">${bookedVal}</span></td>
            <td><span class="metric-pill badge-live">${liveVal}</span></td>
          </tr>
        `;
      });
      return html;
    }

    function renderLiveOnlyRows(items) {
      let html = '';
      items.forEach(item => {
        const liveVal = (data.liveYard && data.liveYard[item.key] !== undefined) ? data.liveYard[item.key] : 0;

        html += `
          <tr>
            <td class="metric-name ps-3"><b>${item.label}</b></td>
            <td><span class="metric-pill badge-live">${liveVal}</span></td>
          </tr>
        `;
      });
      return html;
    }

    document.getElementById('todayKpiRows').innerHTML = renderTodayRows(todayList);
    document.getElementById('specialKpiRows').innerHTML = renderLiveOnlyRows(specialList);
    document.getElementById('tomorrowKpiRows').innerHTML = renderLiveOnlyRows(tomorrowList);

  } catch (err) {
    console.error('Failed to load data.json:', err);
  }
}

// Manual Refresh Trigger Function
async function triggerManualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.innerHTML = '⏳ Refreshing...';

  const scriptUrl = 'https://script.google.com/macros/s/YOUR_APPS_SCRIPT_DEPLOYMENT_ID/exec';

  try {
    await fetch(scriptUrl, { method: 'POST', mode: 'no-cors' });
    
    setTimeout(async () => {
      await loadDashboard();
      btn.disabled = false;
      btn.innerHTML = '🔄 Refresh Data';
    }, 15000);

  } catch (err) {
    console.error('Refresh request failed:', err);
    btn.disabled = false;
    btn.innerHTML = '🔄 Refresh Data';
  }
}

loadDashboard();
setInterval(loadDashboard, 30000); // Auto refresh dashboard every 30 seconds
</script>
</body>
</html>
